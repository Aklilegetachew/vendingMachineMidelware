# /etc/nginx/sites-available/vend.tomocacloud.com
#
# Apply with:
#   sudo nano /etc/nginx/sites-available/vend.tomocacloud.com   # paste this
#   sudo ln -sfn /etc/nginx/sites-available/vend.tomocacloud.com \
#                /etc/nginx/sites-enabled/vend.tomocacloud.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The "managed by Certbot" comments are kept so `certbot renew` still
# recognises and updates this file.

# Port 80 now only redirects to HTTPS. Previously port 80 and 443 were the same
# server block, so the site was served unencrypted as well - which matters here
# because the Telebirr notify callback carries signed payment data.
server {
    listen 80;
    listen [::]:80;
    server_name vend.tomocacloud.com;

    # Leave ACME challenges reachable over plain HTTP so renewal keeps working.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    server_name vend.tomocacloud.com;

    ssl_certificate /etc/letsencrypt/live/vend.tomocacloud.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vend.tomocacloud.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 2m;

    access_log /var/log/nginx/vend.access.log;
    error_log  /var/log/nginx/vend.error.log;

    # -----------------------------------------------------------------------
    # Server-Sent Events (the workbench live feed).
    #
    # Must come BEFORE `location /`, and must disable buffering: with nginx's
    # default proxy_buffering the event stream sits in the buffer and the feed
    # looks frozen. This is the one addition your current config is missing
    # that will bite silently rather than loudly.
    # -----------------------------------------------------------------------
    location /api/events {
        # 127.0.0.1, not localhost: on Ubuntu localhost can resolve to ::1
        # first, and if the app is bound to IPv4 only nginx gets a connection
        # refused it reports as 502.
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # An idle SSE connection must not be reaped as a dead upstream.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # -----------------------------------------------------------------------
    # Everything else: /pay, /pay/success, /api/webhooks/telebirr, /workbench
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
